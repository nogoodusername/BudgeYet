<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="slateBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="tealGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>

    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#FB7185" />
    </linearGradient>
  </defs>

  <!-- App Icon Base Card (8px rounded aesthetic adapted to 64px radius for 512px canvas) -->
  <rect width="512" height="512" rx="100" fill="url(#slateBg)" />

  <!-- Outer Interlocking Loop (Family / Stability) -->
  <path d="M 176,140 
           H 300 
           A 68,68 0 0,1 368,208 
           V 270 
           A 68,68 0 0,1 300,338 
           H 260" 
        fill="none" 
        stroke="url(#tealGrad)" 
        stroke-width="44" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Inner Interlocking Arrow (Exchange / Growth) -->
  <path d="M 336,372 
           H 212 
           A 68,68 0 0,1 144,304 
           V 242 
           A 68,68 0 0,1 212,174 
           H 252" 
        fill="none" 
        stroke="url(#coralGrad)" 
        stroke-width="44" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Central Growth Arrow Core (Intersection point) -->
  <polygon points="256,190 310,250 278,250 278,310 234,310 234,250 202,250" fill="#FFFFFF" opacity="0.95" />
</svg>
