<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>budge-yet — Collaborative Household Budget</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #020617;
        }
        body {
            display: flex;
            justify-content: center;
        }
        /*
         * Compose sizes its WASM canvas backing store from window.innerWidth/innerHeight,
         * not the canvas element's own CSS box — so constraining the canvas's CSS width alone
         * would just scale a full-desktop-resolution bitmap down non-uniformly (visibly
         * squished text/icons). Loading the app in an iframe capped to mobile width gives it
         * its own browsing context, so window.innerWidth inside resolves to the iframe's
         * width and Compose renders a genuinely narrow layout instead of a shrunk-down one.
         */
        #app-frame {
            width: 100%;
            max-width: 480px;
            height: 100%;
            border: none;
            display: block;
            background-color: #0f172a;
        }
    </style>
</head>
<body>
    <iframe id="app-frame" src="app.html" title="budge-yet"></iframe>
</body>
</html>
