<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>budge-yet — Collaborative Household Budget</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0f172a;
            font-family: system-ui, -apple-system, sans-serif;
        }
        #ComposeTarget {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <canvas id="ComposeTarget"></canvas>
    <script type="application/javascript" src="skiko.js"></script>
    <script type="application/javascript">
        // skiko's WASM module is instantiated asynchronously, and skiko.js itself claims
        // Module.onRuntimeInitialized for its own internal readiness promise (so setting it
        // before loading skiko.js gets clobbered). composeApp.js starts creating Skia objects
        // (Paint, etc.) the moment it runs, so it must not load until skiko's wasm runtime has
        // actually finished initializing — otherwise calls into skiko land on stub bindings
        // that throw "is not a function". By the time this script tag runs, skiko.js's
        // synchronous top-level code (including its own onRuntimeInitialized assignment) has
        // already executed, even though the wasm instantiation it kicked off is still pending
        // — so wrapping the callback here is safe. (Production builds parse fast enough to
        // lose this race every time if composeApp.js is loaded unconditionally; unminified dev
        // builds happen to be slow enough to win it, which is why this only shows up in prod.)
        var skikoReady = window.Module.onRuntimeInitialized;
        window.Module.onRuntimeInitialized = function () {
            skikoReady();
            var script = document.createElement('script');
            script.type = 'application/javascript';
            script.src = 'composeApp.js';
            document.body.appendChild(script);
        };
    </script>
</body>
</html>
