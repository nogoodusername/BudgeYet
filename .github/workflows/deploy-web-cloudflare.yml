name: Deploy Web to Cloudflare Pages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  deploy-web:
    name: Build & Deploy Web to Cloudflare Pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x frontend/gradlew || true

      - name: Build Web Production Bundle
        run: |
          cd frontend
          ./gradlew :composeApp:jsBrowserProductionWebpack

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3 pages deploy frontend/composeApp/build/dist/js/productionExecutable \
            --project-name=budgeyet --branch=main --commit-dirty=true
