name: Auto PR to backend/production

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-production-pr.yml'
  workflow_dispatch:

concurrency:
  group: backend-production-pr
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  open-production-pr:
    name: Open or update backend/production PR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create or update PR from main to backend/production
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE: backend/production
          HEAD: main
        run: |
          set -euo pipefail

          # Nothing to do if backend/production is already at main.
          if git diff --quiet "origin/${BASE}" "origin/${HEAD}"; then
            echo "backend/production is already up to date with main. Skipping."
            exit 0
          fi

          existing=$(gh pr list --base "${BASE}" --head "${HEAD}" --state open \
            --json number --jq '.[0].number // empty')

          body=$(cat <<'EOF'
          Automated promotion PR.

          This PR was opened automatically because changes affecting `backend/**`
          were merged into `main`. Merging it promotes `main` to `backend/production`.
          EOF
          )

          if [ -n "${existing}" ]; then
            echo "PR #${existing} already open; it will update automatically. Refreshing body."
            gh pr edit "${existing}" --body "${body}"
          else
            gh pr create \
              --base "${BASE}" \
              --head "${HEAD}" \
              --title "Promote main to backend/production" \
              --body "${body}"
          fi
