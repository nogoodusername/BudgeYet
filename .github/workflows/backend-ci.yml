name: Backend CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main, develop, backend/production ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  lint-and-test:
    name: Backend Test & Quality Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: 'backend/uv.lock'

      - name: Install Backend Dependencies
        run: |
          cd backend
          uv sync --frozen

      - name: Non-interactive Setup SQLite Environment
        run: |
          cd backend
          uv run python scripts/setup_env.py sqlite

      - name: Run Ruff Linter
        run: |
          cd backend
          uv run ruff check app/

      - name: Run Pytest Suite
        run: |
          cd backend
          uv run pytest -v

  docker-build:
    name: Backend Docker Image Build
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Container
        run: |
          cd backend
          docker build -t budge-yet-backend:ci .
