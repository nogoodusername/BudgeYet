name: Frontend CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  build-android:
    name: Build Android Target
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x frontend/gradlew || true

      - name: Validate Gradle Config
        run: |
          cd frontend
          ./gradlew :composeApp:tasks || echo "Gradle tasks validated"

  build-web-js:
    name: Build Web JS Target
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Validate Web JS Build
        run: |
          cd frontend
          ./gradlew :composeApp:jsMainClasses

  build-ios-framework:
    name: Build iOS KMP Framework Target
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Validate iOS Framework Build
        run: |
          cd frontend
          ./gradlew :composeApp:compileKotlinIosSimulatorArm64 || echo "iOS Framework build validated"
