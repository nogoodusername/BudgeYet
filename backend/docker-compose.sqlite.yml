services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fam_ex_backend_sqlite
    ports:
      - "8000:8000"
    environment:
      - DATABASE_TYPE=sqlite
      - SQLITE_DB_FILE=/app/data/fam_ex.db
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in backend/.env (run scripts/setup_env.py first) or export it before running compose}
    volumes:
      - sqlite_data:/app/data
    restart: unless-stopped

volumes:
  sqlite_data:
