services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: budge_yet_backend_sqlite
    ports:
      - "8000:8000"
    # Load backend/.env straight into the container so RESEND_API_KEY etc. reach
    # the app verbatim, regardless of the directory Compose is invoked from.
    env_file:
      - .env
    environment:
      - DATABASE_TYPE=sqlite
      - SQLITE_DB_FILE=/app/data/budge_yet.db
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in backend/.env (run scripts/setup_env.py first) or export it before running compose}
      # RESEND_API_KEY / EMAIL_FROM_ADDRESS / EMAIL_FROM_NAME come from env_file (.env) above.
    volumes:
      - sqlite_data:/app/data
    restart: unless-stopped

  login-cleanup:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: budge_yet_login_cleanup_sqlite
    environment:
      - DATABASE_TYPE=sqlite
      - SQLITE_DB_FILE=/app/data/budge_yet.db
    volumes:
      - sqlite_data:/app/data
    # No cron daemon in the image, so this loops the purge script once a day
    # itself — good enough for a job that just needs to run roughly daily.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "while true; do python scripts/cleanup_login_failures.py; sleep 86400; done"
    restart: unless-stopped

volumes:
  sqlite_data:
