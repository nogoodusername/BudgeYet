services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fam_ex_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_TYPE=${DATABASE_TYPE:-postgres}
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env (run scripts/setup_env.py postgres first) or export it before running compose}
      - POSTGRES_DB=${POSTGRES_DB:-fam_ex}
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in backend/.env (run scripts/setup_env.py first) or export it before running compose}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  login-cleanup:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fam_ex_login_cleanup
    environment:
      - DATABASE_TYPE=${DATABASE_TYPE:-postgres}
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env (run scripts/setup_env.py postgres first) or export it before running compose}
      - POSTGRES_DB=${POSTGRES_DB:-fam_ex}
    depends_on:
      postgres:
        condition: service_healthy
    # No cron daemon in the image, so this loops the purge script once a day
    # itself — good enough for a job that just needs to run roughly daily.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "while true; do python scripts/cleanup_login_failures.py; sleep 86400; done"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: fam_ex_postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env (run scripts/setup_env.py postgres first) or export it before running compose}
      - POSTGRES_DB=${POSTGRES_DB:-fam_ex}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
